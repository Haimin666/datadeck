services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: datadeck:latest
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://datadeck:${POSTGRES_PASSWORD:-datadeck_password}@postgres:5432/datadeck
      DATADECK_SQL_DSN: postgresql://datadeck:${POSTGRES_PASSWORD:-datadeck_password}@postgres:5432/datadeck
      DATADECK_QDRANT_URL: http://qdrant:6333
      DATADECK_REDIS_URL: redis://redis:6379/0
    ports:
      - "${DATADECK_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./server/uploads:/app/server/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: datadeck
      POSTGRES_USER: datadeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datadeck_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datadeck-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U datadeck -d datadeck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - datadeck-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - datadeck-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  datadeck-postgres:
  datadeck-qdrant:
  datadeck-redis:
