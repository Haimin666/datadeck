[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datadeck"
version = "0.1.0"
description = "抽离自 Yuxi 的 LangGraph 智能体核心环：BaseAgent + middleware 链 + tool_approval + toolkits，平台依赖全部收敛为适配者接口。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents>=0.7.7,<0.8",
    "langchain>=1.3.15",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.0.2",
    "langgraph>=1.0.1",
    "langchain-anthropic>=1.6.0",
    "langchain-mcp-adapters>=0.2.1",
    "pydantic>=2.0",
    "python-dotenv>=1.1.0",
    "sqlglot>=25",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.2",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "aiofiles>=24.1.0",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "greenlet>=3.5.5",
    "langgraph-checkpoint-postgres>=2",
    "psycopg[binary,pool]>=3",
    "redis>=5.0",
    "qdrant-client>=1.14.2",
]

[project.optional-dependencies]
# 流式工具调用续片修复依赖（默认即含于 langchain-openai）
streaming = ["langchain-openai>=1.0.2"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["datadeck*"]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "pypdf>=6.13.3",
    "starlette>=1.3.1",
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
